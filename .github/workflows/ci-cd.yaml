name: Monorepo CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [feature/nest_advanced]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      nest_changed: ${{ steps.filter.outputs.nest_advanced }}
      express_changed: ${{ steps.filter.outputs.backend }}
      nextjs_changed: ${{ steps.filter.outputs.nextjs_crud_app }}
      vite_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            nest_advanced:
              - 'nest_advanced/**'
            backend:
              - 'backend/**'
            nextjs_crud_app:
              - 'nextjs_crud_app/**'
            frontend:
              - 'frontend/**'

  ## === NESTJS === ##
  lint-test-nest:
    needs: detect-changes
    if: needs.detect-changes.outputs.nest_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nest_advanced
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  build-push-nest:
    needs: lint-test-nest
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./nest_advanced
          push: true
          tags: |
            lalitrajak312/nest-advanced:latest
            lalitrajak312/nest-advanced:${{ github.sha }}

  ## === EXPRESS BACKEND === ##
  lint-test-express:
    needs: detect-changes
    if: needs.detect-changes.outputs.express_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build-push-express:
    needs: lint-test-express
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            lalitrajak312/express-backend:latest
            lalitrajak312/express-backend:${{ github.sha }}

  ## === NEXT.JS CRUD APP === ##
  lint-test-nextjs:
    needs: detect-changes
    if: needs.detect-changes.outputs.nextjs_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs_crud_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run lint
      - run: npm run test || echo "Skip test if not present"

  build-push-nextjs:
    needs: lint-test-nextjs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./nextjs_crud_app
          push: true
          tags: |
            lalitrajak312/nextjs-crud:latest
            lalitrajak312/nextjs-crud:${{ github.sha }}

  ## === FRONTEND (VITE) === ##
  lint-test-vite:
    needs: detect-changes
    if: needs.detect-changes.outputs.vite_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run lint
      - run: npm run test || echo "Skip test if not present"

  build-push-vite:
    needs: lint-test-vite
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            lalitrajak312/frontend-app:latest
            lalitrajak312/frontend-app:${{ github.sha }}
