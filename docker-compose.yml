version: "3.9"

services:
  mongo:
    image: mongo
    container_name: mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  nest-advanced:
    build:
      context: ./nest_advanced
      dockerfile: Dockerfile
    container_name: nest-advanced-app
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/idurar-erp-crm
    depends_on:
      - mongo

  nextjs-app:
    build:
      context: ./nextjs_crud_app
      dockerfile: Dockerfile
    container_name: nextjs-app
    ports:
      - "4000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/nextjs_crud
      - NEXTAUTH_SECRET=f3GcOhpu676DqOB+7vdScsOi3riAVgcDWJyov99vj9k=
      - NEXTAUTH_URL=http://localhost:4000
    depends_on:
      - mongo

  express-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: express-app
    ports:
      - "8888:8888"
    environment:
      - DATABASE=mongodb://mongo:27017/idurar-erp-crm
      - RESEND_API=your_resend_api
      - OPENAI_API_KEY=your_openai_api_key
      - JWT_SECRET=your_private_jwt_secret_key
      - NODE_ENV=production
      - OPENSSL_CONF=/dev/null
      - PUBLIC_SERVER_FILE=http://localhost:8888/
      - GEMINI_API_KEY=
    depends_on:
      - mongo

  vite_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vite-frontend-app
    ports:
      - "3000:4173"
    environment:
      - VITE_FILE_BASE_URL=http://localhost:8888/
      - VITE_BACKEND_SERVER=http://localhost:8888/
      - PROD=false

volumes:
  mongo-data:
